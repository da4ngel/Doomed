name: Reasoning contracts
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  reasoning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Lint and type-check reasoning-owned Python
        run: |
          uv run ruff check src/agents src/synthesis src/api/routes/chat.py src/core/trace.py src/core/usage.py tests/reasoning
          uv run black --check src/agents src/synthesis src/api/routes/chat.py src/core/trace.py src/core/usage.py tests/reasoning
          uv run mypy src/agents src/synthesis src/api/routes/chat.py src/core/trace.py src/core/usage.py --follow-imports=silent
      - name: Reasoning and frozen-contract regression tests
        run: uv run pytest tests/reasoning tests/unit/test_analyst.py tests/unit/test_trace.py tests/unit/test_schemas.py tests/unit/test_retry.py tests/unit/test_cache.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start explicit scripted API fixture
        run: |
          .venv/bin/uvicorn tests.reasoning.demo_app:create_app --factory --port 8001 > /tmp/reasoning-fixture.log 2>&1 &
          echo $! > /tmp/reasoning-fixture.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reasoning-fixture.log
          exit 1
      - name: Newman reasoning contracts (scripted fixture)
        run: npx --yes newman@6.2.1 run tests/postman/Reasoning.postman_collection.json --env-var base_url=http://127.0.0.1:8001
      - name: Stop scripted API fixture before cache cleanup
        if: always()
        run: |
          if [ -f /tmp/reasoning-fixture.pid ]; then
            kill "$(cat /tmp/reasoning-fixture.pid)" 2>/dev/null || true
          fi
