# Qdrant is the vector store (ADR-004). The API talks to it over QDRANT_URL.
#
# The same code path also runs Qdrant embedded, as a local file, when QDRANT_URL is
# unset - which is what the test suite and CI use so neither needs a running daemon.
services:
  qdrant:
    # Pinned to match qdrant-client. The client warns when the major version differs or
    # the minor gap exceeds one, and a mismatched pair is a silent-wrong-answer risk in
    # a system whose whole point is not returning silent wrong answers.
    image: qdrant/qdrant:v1.19.0
    container_name: ashen-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant images ship no curl, so probe the port from inside with bash.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashen-api
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # The corpus is READ-ONLY, enforced by the mount rather than by convention.
      - ./data/corpus:/app/data/corpus:ro
      - ./data/index:/app/data/index
      - ./data/models:/app/data/models

volumes:
  qdrant_storage:
