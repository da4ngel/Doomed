[project]
name = "ashen-era-assistant"
version = "0.1.0"
description = "Evidence-first RAG over the Ashen Era Archive — SLIIT Codefest 2026"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # ingestion
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "tiktoken>=0.8",
    # indexing / retrieval / graph
    "fastembed>=0.4",
    "qdrant-client>=1.12",
    "bm25s>=0.2",
    "pystemmer>=2.2",
    "networkx>=3.3",
    # cloud providers
    "boto3>=1.35",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The D0 corpus profiler, inherited with the scaffold. Its output is verified
# byte-identical to the original run, so it is not reformatted - a cosmetic edit
# here would put that reproducibility claim at risk for no benefit.
"scripts/profile_corpus.py" = ["E501", "B905"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
